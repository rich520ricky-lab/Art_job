        en: { title: 'Art Portfolio Tutor', company: 'Upwork', location: 'Remote', desc: 'Provide 1-on-1 critique and coaching to students applying to art schools.', salary: '$40–$80/hr' },
        link: 'https://www.upwork.com/', category: 'Freelance'
    }
];

function renderStats() {
    const cats = {};
    jobs.forEach(j => { cats[j.category] = (cats[j.category] || 0) + 1; });
    const container = document.getElementById('stats-container');
    container.innerHTML = Object.entries(cats).map(([k,v]) =>
        `<div class="stat-card"><div class="num">${v}</div><div class="label">${k}</div></div>`
    ).join('');
}

function renderJobs(lang) {
    const container = document.getElementById('job-board');
    const sections = {};
    jobs.forEach(j => {
        if (!sections[j.category]) sections[j.category] = [];
        sections[j.category].push(j);
    });
    const order = ['Major Studios', 'Mid-size Studios', 'Education', 'Freelance'];
    container.innerHTML = order.map(cat => {
        if (!sections[cat]) return '';
        const items = sections[cat].map(j => {
            const d = lang === 'zh' ? j.zh : j.en;
            return `<div class="job-card">
                <h3>${d.title}</h3>
                <div class="company">${d.company}</div>
                <div class="details">
                    <span>📍 ${d.location}</span>
                </div>
                <div class="desc">${d.desc}</div>
                <div class="salary">💰 ${d.salary}</div>
                <a class="btn" href="${j.link}" target="_blank" rel="noopener">Apply Now 立即申請 →</a>
            </div>`;
        }).join('');
        const catNames = { 'Major Studios': '🎬 Major Studios', 'Mid-size Studios': '🎥 Mid-size Studios', 'Education': '📚 Education', 'Freelance': '💼 Freelance' };
        return `<div class="section">
            <div class="section-title">${catNames[cat] || cat} <span class="badge">${sections[cat].length}</span></div>
            ${items}
        </div>`;
    }).join('');
}

function showLang(lang) {
    document.querySelectorAll('.lang-toggle button').forEach(b => b.classList.remove('active'));
    document.querySelector(`.lang-toggle button[onclick*="${lang}"]`).classList.add('active');
    renderJobs(lang);
}

document.getElementById('update-date').textContent = new Date().toISOString().split('T')[0];
renderStats();
renderJobs('zh');
</script>
</body>
</html>
